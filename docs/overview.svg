<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 420" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">What is in Cohort</title>
  <desc id="d">Cohort has two parts, both free and open under Apache-2.0 and both running fully on your own machine: the engine (the cohort-mcp server, its tools, the write gate, and the CLI) and the retrieval and review intelligence that makes up the moat. There is no hosted service, no account, and no telemetry.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="420" rx="16" fill="url(#bg2)"/>

  <text x="40" y="52" font-size="22" font-weight="800" fill="#f8fafc">What is in Cohort</text>
  <text x="40" y="76" font-size="13" fill="#94a3b8">Two parts, both open source under Apache-2.0, both running fully on your own machine.</text>

  <!-- Card 1: engine -->
  <g transform="translate(40,100)">
    <rect width="450" height="236" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.35)"/>
    <rect x="0" y="0" width="450" height="4" rx="2" fill="url(#ac)"/>
    <text x="24" y="36" font-size="16" font-weight="700" fill="#e0e7ff">The engine</text>
    <text x="24" y="56" font-size="11.5" fill="#94a3b8">cohort-mcp server + cohort CLI</text>
    <g font-size="12.5" fill="#cbd5e1">
      <text x="24" y="90">• 6 MCP tools: load, propose, status,</text>
      <text x="38" y="110">policy_get, search, why</text>
      <text x="24" y="138">• Write gate: deny-check, secret and PII</text>
      <text x="38" y="158">scan, instruction linter, contradiction check</text>
      <text x="24" y="186">• Policy engine (policy.yml, fail-closed)</text>
      <text x="24" y="214">• Content-addressed records in git;</text>
      <text x="38" y="234">human-only verify and supersede</text>
    </g>
  </g>

  <!-- Card 2: moat -->
  <g transform="translate(510,100)">
    <rect width="450" height="236" rx="12" fill="rgba(34,211,238,0.06)" stroke="rgba(34,211,238,0.35)"/>
    <rect x="0" y="0" width="450" height="4" rx="2" fill="url(#ac)"/>
    <text x="24" y="36" font-size="16" font-weight="700" fill="#a5f3fc">The moat</text>
    <text x="24" y="56" font-size="11.5" fill="#94a3b8">retrieval and review intelligence</text>
    <g font-size="12.5" fill="#cbd5e1">
      <text x="24" y="90">• Git-native, diffable retrieval index</text>
      <text x="24" y="118">• Token-budgeted, verified-first load</text>
      <text x="24" y="146">• Contradiction detection in the gate</text>
      <text x="24" y="174">• Staleness, supersession, and decay</text>
      <text x="24" y="202">• Deterministic merge, conflict surfacing</text>
      <text x="24" y="230">• cohort_why provenance forensics</text>
    </g>
  </g>

  <!-- footer -->
  <g transform="translate(40,356)">
    <rect width="920" height="44" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="28" font-size="12.5" fill="#94a3b8">Everything runs on your own machine against your own GitHub repo. No hosted service, no account, no telemetry; the maintainers never receive your data.</text>
  </g>
</svg>
