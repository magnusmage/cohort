<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">What is in Cohort</title>
  <desc id="d">Cohort has three parts. The open-core engine (the cohort-mcp server, its tools, the write gate, and the CLI) and the retrieval and review intelligence are free and open under Apache-2.0. A separate, optional commercial control plane adds a read-only, SSO-gated dashboard and never holds the only copy of the memory; the open-core packages never depend on it.</desc>
  <defs>
    <linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="ac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
  </defs>
  <rect width="1000" height="470" rx="16" fill="url(#bg2)"/>

  <text x="40" y="52" font-size="22" font-weight="800" fill="#f8fafc">What is in Cohort</text>
  <text x="40" y="76" font-size="13" fill="#94a3b8">The vault, the engine, and the moat are open source. The control plane is a separate, optional commercial layer.</text>

  <!-- Card 1: open-core engine -->
  <g transform="translate(40,100)">
    <rect width="290" height="230" rx="12" fill="rgba(129,140,248,0.06)" stroke="rgba(129,140,248,0.35)"/>
    <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#ac)"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#e0e7ff">Open-core engine</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">cohort-mcp server + cohort CLI</text>
    <g font-size="11.5" fill="#cbd5e1">
      <text x="20" y="82">• 6 MCP tools: load, propose, status,</text>
      <text x="32" y="99">policy_get, search, why</text>
      <text x="20" y="123">• Write gate: deny-check, secret and</text>
      <text x="32" y="140">PII scan, instruction linter</text>
      <text x="20" y="164">• Policy engine (policy.yml, fail-closed)</text>
      <text x="20" y="188">• Content-addressed records in git</text>
      <text x="20" y="212">• Human-only verify and supersede</text>
    </g>
  </g>

  <!-- Card 2: moat -->
  <g transform="translate(355,100)">
    <rect width="290" height="230" rx="12" fill="rgba(34,211,238,0.06)" stroke="rgba(34,211,238,0.35)"/>
    <rect x="0" y="0" width="290" height="4" rx="2" fill="url(#ac)"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#a5f3fc">The moat</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">retrieval and review intelligence</text>
    <g font-size="11.5" fill="#cbd5e1">
      <text x="20" y="82">• Git-native, diffable retrieval index</text>
      <text x="20" y="106">• Token-budgeted, verified-first load</text>
      <text x="20" y="130">• Contradiction detection in the gate</text>
      <text x="20" y="154">• Staleness, supersession, decay</text>
      <text x="20" y="178">• Deterministic merge, conflict surfacing</text>
      <text x="20" y="202">• cohort_why provenance forensics</text>
    </g>
  </g>

  <!-- Card 3: control plane -->
  <g transform="translate(670,100)">
    <rect width="290" height="230" rx="12" fill="rgba(148,163,184,0.06)" stroke="rgba(148,163,184,0.35)"/>
    <rect x="0" y="0" width="290" height="4" rx="2" fill="#94a3b8"/>
    <text x="20" y="34" font-size="15" font-weight="700" fill="#e2e8f0">Control plane</text>
    <text x="20" y="52" font-size="11" fill="#94a3b8">separate, optional, commercial</text>
    <g font-size="11.5" fill="#cbd5e1">
      <text x="20" y="82">• Read-only review and audit dashboard</text>
      <text x="20" y="106">• Single sign-on, fails closed</text>
      <text x="20" y="130">• Never writes to the vault</text>
      <text x="20" y="154">• Never the only copy of the memory</text>
    </g>
    <text x="20" y="196" font-size="10.5" fill="#64748b">Depends on the open core,</text>
    <text x="20" y="211" font-size="10.5" fill="#64748b">never the other way round.</text>
  </g>

  <!-- footer rule -->
  <g transform="translate(40,360)">
    <rect width="920" height="72" rx="12" fill="rgba(255,255,255,0.03)" stroke="rgba(255,255,255,0.08)"/>
    <text x="24" y="31" font-size="13" font-weight="700" fill="#e2e8f0">The open-core line is enforced, not just promised.</text>
    <text x="24" y="53" font-size="11.5" fill="#94a3b8">A test fails the build if any open-core source imports a control-plane, dashboard, or SSO component. The vault, server, and CLI run fully offline with no account and no network beyond your git remote.</text>
  </g>
</svg>
