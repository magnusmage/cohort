<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 300" role="img" aria-labelledby="t d" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="t">Cohort</title>
  <desc id="d">Cohort: shared memory for your team's AI chatbots. One markdown vault on GitHub that every teammate's AI reads and writes, with a human approving every change.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/>
      <stop offset="1" stop-color="#111a30"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/>
      <stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#6366f1" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#6366f1" stop-opacity="0"/>
    </radialGradient>
  </defs>

  <rect width="1000" height="300" rx="16" fill="url(#bg)"/>
  <circle cx="820" cy="150" r="220" fill="url(#glow)"/>

  <!-- wordmark -->
  <text x="64" y="118" font-size="64" font-weight="800" fill="#f8fafc" letter-spacing="-1.5">cohort</text>
  <rect x="66" y="132" width="132" height="4" rx="2" fill="url(#accent)"/>

  <!-- tagline -->
  <text x="64" y="176" font-size="24" font-weight="600" fill="#e2e8f0">Shared memory for your team's AI.</text>
  <text x="64" y="208" font-size="15" fill="#94a3b8">One markdown vault on GitHub. Every teammate's AI reads and writes the same memory,</text>
  <text x="64" y="229" font-size="15" fill="#94a3b8">regardless of account, plan, or platform, and a human approves every change.</text>

  <!-- chips -->
  <g font-size="12" font-weight="600">
    <rect x="64" y="250" width="150" height="26" rx="13" fill="rgba(129,140,248,0.14)" stroke="#818cf8" stroke-opacity="0.4"/>
    <text x="139" y="267" text-anchor="middle" fill="#c7d2fe">local-first, no telemetry</text>
    <rect x="224" y="250" width="150" height="26" rx="13" fill="rgba(34,211,238,0.12)" stroke="#22d3ee" stroke-opacity="0.4"/>
    <text x="299" y="267" text-anchor="middle" fill="#a5f3fc">human-in-the-loop</text>
    <rect x="384" y="250" width="132" height="26" rx="13" fill="rgba(148,163,184,0.12)" stroke="#94a3b8" stroke-opacity="0.4"/>
    <text x="450" y="267" text-anchor="middle" fill="#cbd5e1">git is the transport</text>
  </g>

  <!-- motif: agents -> gate -> vault -->
  <g transform="translate(640,70)">
    <!-- agents -->
    <g>
      <circle cx="40" cy="30" r="16" fill="rgba(255,255,255,0.06)" stroke="#818cf8"/>
      <circle cx="40" cy="80" r="16" fill="rgba(255,255,255,0.06)" stroke="#818cf8"/>
      <circle cx="40" cy="130" r="16" fill="rgba(255,255,255,0.06)" stroke="#818cf8"/>
      <text x="40" y="34" text-anchor="middle" font-size="14" fill="#c7d2fe">AI</text>
      <text x="40" y="84" text-anchor="middle" font-size="14" fill="#c7d2fe">AI</text>
      <text x="40" y="134" text-anchor="middle" font-size="14" fill="#c7d2fe">AI</text>
    </g>
    <!-- gate -->
    <rect x="120" y="54" width="60" height="52" rx="10" fill="rgba(34,211,238,0.10)" stroke="#22d3ee"/>
    <text x="150" y="78" text-anchor="middle" font-size="11" font-weight="700" fill="#a5f3fc">gate</text>
    <text x="150" y="94" text-anchor="middle" font-size="9" fill="#67e8f9">+ human</text>
    <!-- vault -->
    <g transform="translate(250,34)">
      <path d="M0,14 C0,6 20,0 45,0 C70,0 90,6 90,14 L90,78 C90,86 70,92 45,92 C20,92 0,86 0,78 Z" fill="rgba(129,140,248,0.12)" stroke="url(#accent)" stroke-width="1.5"/>
      <ellipse cx="45" cy="14" rx="45" ry="10" fill="rgba(129,140,248,0.18)" stroke="url(#accent)" stroke-width="1.5"/>
      <text x="45" y="52" text-anchor="middle" font-size="12" font-weight="700" fill="#e0e7ff">vault</text>
      <text x="45" y="68" text-anchor="middle" font-size="9" fill="#a5b4fc">.md in git</text>
    </g>
    <!-- arrows -->
    <g stroke="#64748b" stroke-width="1.5" fill="none" marker-end="url(#a)">
      <path d="M58,80 L116,80"/>
      <path d="M182,80 L246,80"/>
    </g>
    <defs>
      <marker id="a" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
        <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
      </marker>
    </defs>
  </g>
</svg>
