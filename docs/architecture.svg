<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Cohort architecture</title>
  <desc id="desc">Teammates' AI clients load bounded context from a shared git vault and propose writebacks back through a local redaction gate, human approval, and a review-gated pull request. No hosted server and no Cohort infrastructure exist.</desc>

  <defs>
    <linearGradient id="abg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0b1222"/><stop offset="1" stop-color="#101a2e"/>
    </linearGradient>
    <linearGradient id="aac" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#818cf8"/><stop offset="1" stop-color="#22d3ee"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#64748b"/>
    </marker>
  </defs>

  <rect width="860" height="400" rx="16" fill="url(#abg)"/>

  <!-- teammate A -->
  <rect x="30" y="70" width="180" height="96" rx="10" fill="rgba(255,255,255,0.05)" stroke="#818cf8" stroke-opacity="0.5"/>
  <text x="120" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">teammate A</text>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#cbd5e1">AI client, any platform</text>
  <text x="120" y="129" text-anchor="middle" font-size="10" fill="#94a3b8">+ cohort skill</text>
  <text x="120" y="147" text-anchor="middle" font-size="10" fill="#94a3b8">on the teammate's machine</text>

  <!-- teammate B -->
  <rect x="650" y="70" width="180" height="96" rx="10" fill="rgba(255,255,255,0.05)" stroke="#818cf8" stroke-opacity="0.5"/>
  <text x="740" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#e2e8f0">teammate B</text>
  <text x="740" y="113" text-anchor="middle" font-size="11" fill="#cbd5e1">any AI client, any platform</text>
  <text x="740" y="129" text-anchor="middle" font-size="10" fill="#94a3b8">+ cohort skill</text>
  <text x="740" y="147" text-anchor="middle" font-size="10" fill="#94a3b8">on the teammate's machine</text>

  <!-- the vault -->
  <rect x="340" y="55" width="180" height="130" rx="10" fill="rgba(129,140,248,0.12)" stroke="url(#aac)" stroke-width="1.5"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#e0e7ff">the vault repo</text>
  <text x="430" y="98" text-anchor="middle" font-size="11" fill="#c7d2fe">git, on GitHub, in your account</text>
  <line x1="360" y1="108" x2="500" y2="108" stroke="#818cf8" stroke-width="0.75" opacity="0.5"/>
  <text x="430" y="126" text-anchor="middle" font-size="11" fill="#cbd5e1">VAULT.md manifest</text>
  <text x="430" y="143" text-anchor="middle" font-size="11" fill="#cbd5e1">facts/ · decisions/</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#cbd5e1">threads/ · .cohort/</text>

  <!-- read path: vault -> clients -->
  <line x1="340" y1="105" x2="218" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="279" y="96" text-anchor="middle" font-size="11" fill="#94a3b8">load: bounded context</text>
  <line x1="520" y1="105" x2="642" y2="105" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="581" y="96" text-anchor="middle" font-size="11" fill="#94a3b8">load: bounded context</text>

  <!-- write path: client -> gate -> approval -> PR -> vault -->
  <path d="M 120 166 L 120 302 L 164 302" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="243" font-size="11" fill="#94a3b8">propose writeback</text>

  <rect x="170" y="282" width="150" height="40" rx="8" fill="rgba(251,188,46,0.12)" stroke="#febc2e" stroke-opacity="0.6"/>
  <text x="245" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#fde68a">redaction gate</text>
  <text x="245" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">local gitleaks, fail closed</text>

  <line x1="320" y1="302" x2="336" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="282" width="140" height="40" rx="8" fill="rgba(40,200,64,0.12)" stroke="#28c840" stroke-opacity="0.6"/>
  <text x="410" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#86efac">human approval</text>
  <text x="410" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">always required in chat</text>

  <line x1="480" y1="302" x2="486" y2="302" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="282" width="150" height="40" rx="8" fill="rgba(130,80,223,0.14)" stroke="#a78bfa" stroke-opacity="0.6"/>
  <text x="565" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#ddd6fe">review-gated PR</text>
  <text x="565" y="313" text-anchor="middle" font-size="10" fill="#94a3b8">a second human approves</text>

  <path d="M 565 282 L 565 245 L 455 245 L 455 192" fill="none" stroke="#64748b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="239" text-anchor="middle" font-size="10" fill="#94a3b8">merge</text>

  <!-- teammate B writes the same way -->
  <path d="M 700 166 L 700 302 L 646 302" fill="none" stroke="#64748b" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="708" y="252" font-size="10" font-style="italic" fill="#94a3b8">same write path</text>

  <!-- the honest bottom line -->
  <text x="430" y="372" text-anchor="middle" font-size="12" fill="#64748b">No hosted server, no Cohort infrastructure, no telemetry. The repo is the only shared place.</text>
</svg>
