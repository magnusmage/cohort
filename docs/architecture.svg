<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 400" role="img" aria-labelledby="title desc" font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">Cohort architecture</title>
  <desc id="desc">Teammates' AI clients load bounded context from a shared git vault and propose writebacks back through a local redaction gate, human approval, and a review-gated pull request. No servers and no Cohort infrastructure exist.</desc>

  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#57606a"/>
    </marker>
  </defs>

  <!-- teammate A -->
  <rect x="30" y="70" width="180" height="96" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="120" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">teammate A</text>
  <text x="120" y="113" text-anchor="middle" font-size="11" fill="#1f2328">AI client (Kimi Code CLI)</text>
  <text x="120" y="129" text-anchor="middle" font-size="10" fill="#57606a">+ cohort skill</text>
  <text x="120" y="147" text-anchor="middle" font-size="10" fill="#57606a">on the teammate's machine</text>

  <!-- teammate B -->
  <rect x="650" y="70" width="180" height="96" rx="8" fill="#f6f8fa" stroke="#57606a"/>
  <text x="740" y="94" text-anchor="middle" font-size="13" font-weight="600" fill="#1f2328">teammate B</text>
  <text x="740" y="113" text-anchor="middle" font-size="11" fill="#1f2328">any AI client, any platform</text>
  <text x="740" y="129" text-anchor="middle" font-size="10" fill="#57606a">+ cohort skill</text>
  <text x="740" y="147" text-anchor="middle" font-size="10" fill="#57606a">on the teammate's machine</text>

  <!-- the vault -->
  <rect x="340" y="55" width="180" height="130" rx="8" fill="#e7f3ff" stroke="#0969da"/>
  <text x="430" y="80" text-anchor="middle" font-size="14" font-weight="700" fill="#1f2328">the vault repo</text>
  <text x="430" y="98" text-anchor="middle" font-size="11" fill="#1f2328">git, on GitHub, in your account</text>
  <line x1="360" y1="108" x2="500" y2="108" stroke="#0969da" stroke-width="0.75" opacity="0.5"/>
  <text x="430" y="126" text-anchor="middle" font-size="11" fill="#1f2328">VAULT.md manifest</text>
  <text x="430" y="143" text-anchor="middle" font-size="11" fill="#1f2328">memory/ · sessions/</text>
  <text x="430" y="160" text-anchor="middle" font-size="11" fill="#1f2328">decisions/ · pointers</text>

  <!-- read path: vault -> clients -->
  <line x1="340" y1="105" x2="218" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="279" y="96" text-anchor="middle" font-size="11" fill="#57606a">load: bounded context</text>
  <line x1="520" y1="105" x2="642" y2="105" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="581" y="96" text-anchor="middle" font-size="11" fill="#57606a">load: bounded context</text>

  <!-- write path: client -> gate -> approval -> PR -> vault -->
  <path d="M 120 166 L 120 302 L 164 302" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="130" y="243" font-size="11" fill="#57606a">propose writeback</text>

  <rect x="170" y="282" width="150" height="40" rx="6" fill="#fff8e6" stroke="#9a6700"/>
  <text x="245" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">redaction gate</text>
  <text x="245" y="313" text-anchor="middle" font-size="10" fill="#57606a">local gitleaks, fail closed</text>

  <line x1="320" y1="302" x2="336" y2="302" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="340" y="282" width="140" height="40" rx="6" fill="#e9f9ef" stroke="#1a7f37"/>
  <text x="410" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">human approval</text>
  <text x="410" y="313" text-anchor="middle" font-size="10" fill="#57606a">always required in chat</text>

  <line x1="480" y1="302" x2="486" y2="302" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>

  <rect x="490" y="282" width="150" height="40" rx="6" fill="#f3eefc" stroke="#8250df"/>
  <text x="565" y="299" text-anchor="middle" font-size="12" font-weight="600" fill="#1f2328">review-gated PR</text>
  <text x="565" y="313" text-anchor="middle" font-size="10" fill="#57606a">a second human approves</text>

  <path d="M 565 282 L 565 245 L 455 245 L 455 192" fill="none" stroke="#57606a" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="510" y="239" text-anchor="middle" font-size="10" fill="#57606a">merge</text>

  <!-- teammate B writes the same way -->
  <path d="M 700 166 L 700 302 L 646 302" fill="none" stroke="#57606a" stroke-width="1.5" stroke-dasharray="5 4" marker-end="url(#arrow)"/>
  <text x="708" y="252" font-size="10" font-style="italic" fill="#57606a">same write path</text>

  <!-- the honest bottom line -->
  <text x="430" y="372" text-anchor="middle" font-size="12" fill="#57606a">No servers, no Cohort infrastructure, no telemetry. The repo is the only shared place.</text>
</svg>
