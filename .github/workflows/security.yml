name: security

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

env:
  # Pinned gitleaks. The gitleaks GitHub Action needs a paid license on org
  # repos; the tool itself is free, so CI installs the binary directly.
  # Bump deliberately, and bump the checksum verification with it.
  GITLEAKS_VERSION: "8.30.1"

jobs:
  gitleaks:
    name: Redaction scan (gitleaks)
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit SHA (supply chain, SECURITY.md T6).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Install gitleaks (pinned and checksum-verified)
        run: |
          set -e
          base="https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}"
          pkg="gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          curl -sSfL "$base/$pkg" -o "$pkg"
          curl -sSfL "$base/gitleaks_${GITLEAKS_VERSION}_checksums.txt" -o checksums.txt
          grep "linux_x64.tar.gz" checksums.txt | sha256sum --check -
          tar -xzf "$pkg" gitleaks
          sudo install -m 0755 gitleaks /usr/local/bin/gitleaks
      - name: Scan repository and history
        run: gitleaks git --config security/redaction-rules.toml --verbose

  vault-schema:
    name: Validate vault schema
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit SHA (supply chain, SECURITY.md T6).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Validate example vault and template against the v1 schema
        run: |
          sh scripts/validate-vault.sh example-vault
          sh scripts/validate-vault.sh vault-template

  installer:
    name: Installer syntax check
    runs-on: ubuntu-latest
    steps:
      # Pinned to the v4.2.2 commit SHA (supply chain, SECURITY.md T6).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - name: Syntax-check install.sh
        run: sh -n install.sh
