name: cohort-mcp

# Build, lint, test, and audit the cohort-mcp package. Runs only when the
# package or this workflow changes. This brings the server CI gate forward so
# Phase 1 tickets after the scaffold are protected; the fuller adversarial
# suite lands with the end-to-end acceptance work (#37).

on:
  push:
    branches: [main]
    paths:
      - "cohort-mcp/**"
      - ".github/workflows/cohort-mcp.yml"
  pull_request:
    paths:
      - "cohort-mcp/**"
      - ".github/workflows/cohort-mcp.yml"

permissions:
  contents: read

jobs:
  build-test:
    name: Build, lint, test, audit
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: cohort-mcp
    steps:
      # Pinned to the v4.2.2 commit SHA (supply chain, SECURITY.md T6).
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      # Pinned to the v7.1.0 commit SHA (supply chain, SECURITY.md T6).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: cohort-mcp/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build
      - run: npm test
      - run: npm run audit
